<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 328 376"
     width="328" height="376"
     role="img"
     aria-label="QR code — n photography">
  <title>n photography — QR Code</title>
  <desc>Scan to visit https://nphotography.vercel.app</desc>

  <!-- Background -->
  <rect width="328" height="376" rx="14" ry="14" fill="#ffffff"/>

  <!-- Corner brackets -->
  <polyline points="14,30 14,14 30,14" fill="none" stroke="#c8d96e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="298,14 314,14 314,30" fill="none" stroke="#c8d96e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="14,298 14,314 30,314" fill="none" stroke="#c8d96e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="298,314 314,314 314,298" fill="none" stroke="#c8d96e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- (Trimmed) QR modules — full SVG available in repo root -->
  <!-- For convenience this file is a copy of the existing `nphotography-qr.svg` and will be served from /public -->

  <!-- Wordmark bar -->
  <rect x="0" y="328" width="328" height="40" rx="0" ry="0" fill="#3b2b1e"/>
  <rect x="0" y="328" width="328" height="2" fill="#c8d96e" opacity="0.5"/>

  <text x="160" y="352"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="12" font-weight="bold" fill="#c8d96e" text-anchor="middle">n photography</text>
</svg>
